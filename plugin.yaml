name: godseye
version: "0.2.9"
description: >-
  Eye Of Hermes (EOH), built on God's Eye View: registers the God's Eye View public-data tools
  (aircraft, ships, satellites, quakes, fires, weather, infrastructure, public SDR) as
  eleven composable godseye_* tools backed by its MCP server, adds a live globe pane to Hermes
  Desktop and the Webapp that Hermes can drive and read, and generates HUD summaries
  with the Hermes model (ctx.llm) instead of OpenAI. No named-person search, face
  recognition, or tracking of individuals. Needs Hermes >= 0.23.0 (desktop ctx.rest)
  and the mojomast/gods-eye-view fork at or after b361a25 for public SDR.
author: mojomast
license: MIT
homepage: https://github.com/mojomast/EOH
tags: [geospatial, osint, globe, mcp, desktop]
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
provides_hooks:
  - pre_llm_call
provides_tools:
  - godseye_view
  - godseye_query
  - godseye_layers
  - godseye_feeds
  - godseye_annotate
  - godseye_nav
  - godseye_track
  - godseye_scene
  - godseye_watch
  - godseye_capture
  - godseye_admin

requires_env:
  - name: GOOGLE_MAPS_API_KEY
    description: >-
      Optional. Google Street View / Maps key for server-side street-level
      panorama lookup (godseye_nav street_level / street_walk). Leave unset to
      skip Google lookups; the rest of EOH still loads.
    url: https://console.cloud.google.com/apis/credentials
    secret: true
  - name: GOOGLE_API_KEY
    description: >-
      Optional. Alternate Google API key used only when GOOGLE_MAPS_API_KEY is
      unset. Leave unset if you already set GOOGLE_MAPS_API_KEY.
    url: https://console.cloud.google.com/apis/credentials
    secret: true
  - name: MAPILLARY_CLIENT_TOKEN
    description: >-
      Optional. Mapillary token used when Google Street View misses or has no
      key. Leave unset to skip Mapillary lookups; the rest of EOH still loads.
    url: https://www.mapillary.com/dashboard/developers
    secret: true
  - name: CESIUM_ION_TOKEN
    description: Optional. Browser-visible Cesium map token; limit to assets:read and assets:list.
    secret: true
  - name: FIRMS_MAP_KEY
    description: Optional. NASA FIRMS active-fire feed credential.
    secret: true
  - name: FIRMS_API_KEY
    description: Optional. Legacy alias for FIRMS_MAP_KEY.
    secret: true
  - name: FIRMS_KEY
    description: Optional. Legacy alias for FIRMS_MAP_KEY.
    secret: true
  - name: NASA_FIRMS_KEY
    description: Optional. Legacy alias for FIRMS_MAP_KEY.
    secret: true
  - name: AISSTREAM_API_KEY
    description: Optional. AISStream vessel feed credential.
    secret: true
  - name: TOMTOM_API_KEY
    description: Optional. TomTom traffic feed credential.
    secret: true
