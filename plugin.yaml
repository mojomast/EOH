name: godseye
version: "0.2.6"
description: >-
  Eye Of Hermes (EOH), built on God's Eye View: registers the God's Eye View public-data tools
  (aircraft, ships, satellites, quakes, fires, weather, infrastructure) as
  godseye_* tools backed by its MCP server, adds a live globe pane to Hermes
  Desktop and the Webapp that Hermes can drive and read (godseye_live_* tools),
  and generates HUD summaries with the Hermes model (ctx.llm) instead
  of OpenAI. No named-person search, face recognition, or tracking of
  individuals.
author: mojomast
license: MIT
homepage: https://github.com/mojomast/hermes-godseye
tags: [geospatial, osint, globe, mcp, desktop]
manifest_version: 2
api_version: 1
provides_hooks:
  - pre_llm_call
provides_tools:
  - godseye_view
  - godseye_query
  - godseye_layers
  - godseye_feeds
  - godseye_annotate
  - godseye_nav
  - godseye_track
  - godseye_scene
  - godseye_watch
  - godseye_capture
  - godseye_admin

requires_env:
  - name: GOOGLE_MAPS_API_KEY
    description: >-
      Optional. Google Street View / Maps key for server-side street-level
      panorama lookup (godseye_nav street_level / street_walk). Leave unset to
      skip Google lookups; the rest of EOH still loads.
    url: https://console.cloud.google.com/apis/credentials
    secret: true
  - name: GOOGLE_API_KEY
    description: >-
      Optional. Alternate Google API key used only when GOOGLE_MAPS_API_KEY is
      unset. Leave unset if you already set GOOGLE_MAPS_API_KEY.
    url: https://console.cloud.google.com/apis/credentials
    secret: true
  - name: MAPILLARY_CLIENT_TOKEN
    description: >-
      Optional. Mapillary token used when Google Street View misses or has no
      key. Leave unset to skip Mapillary lookups; the rest of EOH still loads.
    url: https://www.mapillary.com/dashboard/developers
    secret: true
