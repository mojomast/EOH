name: godseye
version: "0.1.0"
description: >-
  God's Eye View inside Hermes: registers the God's Eye View public-data tools
  (aircraft, ships, satellites, quakes, fires, weather, infrastructure) as
  godseye_* tools backed by its MCP server, adds a live globe pane to Hermes
  Desktop, and generates HUD summaries with the Hermes model (ctx.llm) instead
  of OpenAI. No named-person search, face recognition, or tracking of
  individuals.
author: mojomast
license: MIT
homepage: https://github.com/mojomast/hermes-godseye
tags: [geospatial, osint, globe, mcp, desktop]
manifest_version: 2
api_version: 1
provides_tools:
  - godseye_get_earthquakes
  - godseye_get_active_fires
  - godseye_get_recent_launches
  - godseye_aircraft_in_area
  - godseye_find_aircraft
  - godseye_get_aircraft_track
  - godseye_get_aircraft_info
  - godseye_vessels_in_area
  - godseye_find_vessel
  - godseye_get_vessel_track
  - godseye_next_satellite_pass
  - godseye_satellites_overhead
  - godseye_find_cctv_cameras
  - godseye_get_cctv_snapshot
  - godseye_find_alpr_cameras
  - godseye_get_traffic_flow
  - godseye_get_weather_map
  - godseye_get_recent_imagery
  - godseye_find_submarine_cables
  - godseye_find_infrastructure
  - godseye_get_bhote_koshi_flood
  - godseye_get_cyclones
  - godseye_get_fire_perimeters
  - godseye_get_terrain_height
  - godseye_find_military_installations
  - godseye_get_map_features
  - godseye_situation_brief
  - godseye_military_awareness
  - godseye_show_in_gods_eye_view
  - godseye_hud_summary
